name: Auto Version Bump

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Determine version bump type
        id: bump-type
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          # Check for breaking changes
          if echo "$COMMIT_MSG" | grep -qiE "BREAKING CHANGE|!:"; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "Version bump: MAJOR (breaking change detected)"
          # Check for new features
          elif echo "$COMMIT_MSG" | grep -qiE "^feat(\(.+\))?:"; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "Version bump: MINOR (new feature)"
          # Check for fixes
          elif echo "$COMMIT_MSG" | grep -qiE "^fix(\(.+\))?:"; then
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "Version bump: PATCH (bug fix)"
          # Default to patch for other commits
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "Version bump: PATCH (default)"
          fi

      - name: Bump version in package.json
        id: version
        run: |
          BUMP_TYPE="${{ steps.bump-type.outputs.type }}"
          NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version)
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Update version in app.json
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          # Remove the 'v' prefix
          VERSION_NUMBER="${NEW_VERSION#v}"

          # Update expo.version in app.json
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            appJson.expo.version = '$VERSION_NUMBER';
            fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2) + '\n');
          "

          echo "Updated app.json version to: $VERSION_NUMBER"

      - name: Commit version bump
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          git add package.json package-lock.json app.json
          git commit -m "chore(release): bump version to ${NEW_VERSION}

          🤖 Automated version bump

          This version was automatically incremented based on the commit type."

      - name: Create Git tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          git tag -a "${NEW_VERSION}" -m "Release ${NEW_VERSION}"

      - name: Push changes and tags
        run: |
          git push origin main
          git push origin --tags

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          release_name: Release ${{ steps.version.outputs.new_version }}
          body: |
            ## Changes in ${{ steps.version.outputs.new_version }}

            **Commit:** ${{ github.event.head_commit.message }}

            ### Installation

            To install this version:
            ```bash
            git checkout ${{ steps.version.outputs.new_version }}
            npm install
            ```

            🤖 This release was automatically created by GitHub Actions.
          draft: false
          prerelease: false
